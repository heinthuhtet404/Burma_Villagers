<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================
         FAVICON
         SVG first (modern browsers), then PNG fallbacks
         ============================================ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#093e18" />

    <!-- ============================================
         SEO — Title + Description
         ============================================ -->
    <title>Burma Villagers — 350 GSM Air Layer</title>
    <meta
      name="description"
      content="Heavy-weight essentials from Yangon. 350 GSM air layer tees built for structure, made for everyday wear."
    />

    <link rel="canonical" href="https://burmavillagers.com" />

    <!-- ============================================
         OPEN GRAPH (Facebook, WhatsApp, Telegram)
         ============================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Burma Villagers" />
    <meta property="og:title" content="Burma Villagers — 350 GSM Air Layer" />

      property="og:description"
      content="Heavy-weight essentials. Made for everyday."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://burmavillagers.com" />

    <!-- ============================================
         TWITTER
         ============================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Burma Villagers — 350 GSM Air Layer" />
    <meta
      name="twitter:description"
      content="Heavy-weight essentials. Made for everyday."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
